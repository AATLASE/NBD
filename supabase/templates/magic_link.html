<h2>Connexion</h2>
<p>Appuie sur le lien ci-dessous pour te connecter. Il est valable une heure et ne sert qu'une fois.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email">Me connecter</a></p>
<p>Si tu utilises l'application installée sur ton téléphone, saisis plutôt ce code dans l'écran de connexion :</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 4px;">{{ .Token }}</p>
<p>Si tu n'as rien demandé, ignore ce message.</p>
